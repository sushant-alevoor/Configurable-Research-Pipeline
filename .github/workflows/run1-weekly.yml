name: Run1 - Weekly Search & Curate

on:
  schedule:
    # 06:00 UTC every Monday. Adjust to taste — cron is always UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    # Lets you trigger a run manually from the Actions tab, e.g. to test
    # this workflow without waiting for the schedule.
    inputs:
      profile:
        description: 'Config profile name (matches config/<name>.json)'
        required: false
        default: 'frictionless-architecture'

permissions:
  issues: write
  contents: read

jobs:
  search-and-curate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run search + curate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        run: node run1-search-curate.js "${{ github.event.inputs.profile || 'frictionless-architecture' }}"
