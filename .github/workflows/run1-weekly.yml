name: Run1 - Weekly Search & Curate

on:
  schedule:
    # 06:00 UTC every Monday. Adjust to taste — cron is always UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    # Lets you trigger a run manually from the Actions tab, e.g. to test
    # this workflow without waiting for the schedule.
    inputs:
      profile:
        description: 'Config profile name (matches config/<name>.json)'
        required: false
        default: 'organizational-friction'

permissions:
  issues: write
  contents: read

jobs:
  search-and-curate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Restore dedup cache
        uses: actions/cache/restore@v4
        with:
          path: .dedup-cache
          key: dedup-${{ github.run_id }}
          restore-keys: |
            dedup-

      - name: Run search + curate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        run: node run1-search-curate.js "${{ github.event.inputs.profile || 'organizational-friction' }}"

      # Always save, even if the run above failed after search but before
      # curation — the point of this cache is "don't re-search a URL we've
      # already seen," so it should persist regardless of how far the run got.
      - name: Save dedup cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .dedup-cache
          key: dedup-${{ github.run_id }}
