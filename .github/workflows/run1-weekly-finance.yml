name: Run1 - Weekly Search & Curate (Finance)

on:
  schedule:
    # 06:00 UTC every Wednesday — deliberately offset from the general
    # organizational-friction schedule (Mondays) so the two profiles don't
    # run at the same time and their Issues don't land on the same day.
    - cron: '0 6 * * 3'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Config profile name (matches config/<name>.json)'
        required: false
        default: 'research-agent-finance'

permissions:
  issues: write
  contents: read

jobs:
  search-and-curate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      # Cache key is namespaced by profile so this workflow's dedup cache
      # never collides with organizational-friction's cache — each profile
      # gets its own restore lineage.
      - name: Restore dedup cache
        uses: actions/cache/restore@v4
        with:
          path: .dedup-cache
          key: dedup-research-agent-finance-${{ github.run_id }}
          restore-keys: |
            dedup-research-agent-finance-

      - name: Run search + curate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        run: node run1-search-curate.js "${{ github.event.inputs.profile || 'research-agent-finance' }}"

      # Always save, even if the run above failed after search but before
      # curation — the point of this cache is "don't re-search a URL we've
      # already seen," so it should persist regardless of how far the run got.
      - name: Save dedup cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .dedup-cache
          key: dedup-research-agent-finance-${{ github.run_id }}
